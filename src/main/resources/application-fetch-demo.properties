# ---------------------------------------------------------------------------
# Profilo per l'analisi sperimentale delle strategie di accesso ai dati.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=fetch-demo
#
# Abilita le statistiche di Hibernate (usate per contare le query SQL) e il
# log delle query, cosi' da poter osservare il problema delle N+1 query.
# ---------------------------------------------------------------------------
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.stat=INFO
