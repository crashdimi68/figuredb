<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: headerfiles('La mia collezione')}"></head>
<body>
<header th:replace="~{fragments/base :: intestazione}"></header>
<main class="container">
    <div th:replace="~{fragments/base :: messaggi}"></div>
    <h1>La mia collezione</h1>
    <p>Valore delle figure possedute:
        <strong th:text="${#numbers.formatDecimal(valore, 1, 2)} + ' EUR'">0,00</strong></p>

    <form th:action="@{/collezione}" method="get" class="form-inline">
        <select name="stato">
            <option value="">Tutte</option>
            <option th:each="s : ${stati}" th:value="${s}" th:text="${s}"
                    th:selected="${s == statoSelezionato}">stato</option>
        </select>
        <button type="submit" class="bottone">Filtra</button>
    </form>

    <table class="tabella">
        <thead>
        <tr><th>Figure</th><th>Serie</th><th>Stato</th><th>Q.ta</th><th>Note</th><th>Azioni</th></tr>
        </thead>
        <tbody>
        <tr th:each="v : ${voci}">
            <td><a th:href="@{/figure/{id}(id=${v.figure.id})}" th:text="${v.figure.nome}">nome</a></td>
            <td th:text="${v.figure.serie.nome}">serie</td>
            <td>
                <form th:action="@{/collezione/{id}/aggiorna(id=${v.id})}" method="post" class="inline-form">
                    <select name="stato">
                        <option th:each="s : ${stati}" th:value="${s}" th:text="${s}"
                                th:selected="${s == v.stato}">stato</option>
                    </select>
                    <input type="number" name="quantita" th:value="${v.quantita}" min="1" style="width:4rem"/>
                    <input type="hidden" name="note" th:value="${v.note}"/>
                    <button type="submit" class="link-button">Salva</button>
                </form>
            </td>
            <td th:text="${v.quantita}">1</td>
            <td th:text="${v.note}">note</td>
            <td>
                <form th:action="@{/collezione/{id}/rimuovi(id=${v.id})}" method="post" class="inline-form">
                    <button type="submit" class="link-button pericolo">Rimuovi</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(voci)}">La tua collezione e' vuota.</p>
</main>
<footer th:replace="~{fragments/base :: fondo}"></footer>
</body>
</html>
