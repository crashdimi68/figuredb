<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: headerfiles(${disegnatore.nomeCompleto})}"></head>
<body>
<header th:replace="~{fragments/base :: intestazione}"></header>
<main class="container">
    <h1 th:text="${disegnatore.nomeCompleto}">disegnatore</h1>
    <dl>
        <dt>Data di nascita</dt>
        <dd th:text="${#temporals.format(disegnatore.dataNascita, 'dd/MM/yyyy')}">data</dd>
        <dt>Paese</dt><dd th:text="${disegnatore.paese}">paese</dd>
    </dl>
    <h2>Fumetti disegnati</h2>
    <ul class="lista">
        <li th:each="f : ${disegnatore.fumetti}">
            <a th:href="@{/fumetti/{id}(id=${f.id})}" th:text="${f.titolo} + ' (' + ${f.anno} + ')'">titolo</a>
        </li>
    </ul>
    <p th:if="${#lists.isEmpty(disegnatore.fumetti)}">Nessun fumetto registrato.</p>
</main>
</body>
</html>
