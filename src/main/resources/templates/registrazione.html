<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: headerfiles('Registrazione')}"></head>
<body>
<header th:replace="~{fragments/base :: intestazione}"></header>

<main class="container stretto">
    <h1>Crea un account</h1>
    <p class="alert errore" th:if="${erroreRegistrazione}" th:text="${erroreRegistrazione}"></p>

    <form th:action="@{/register}" method="post" class="form">
        <div th:object="${user}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}"/>
            <span class="errore-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

            <label for="cognome">Cognome</label>
            <input type="text" id="cognome" th:field="*{cognome}"/>
            <span class="errore-campo" th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}"></span>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}"/>
            <span class="errore-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div th:object="${credentials}">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}"/>
            <span class="errore-campo" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}"/>
            <span class="errore-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <button type="submit" class="bottone">Registrati</button>
    </form>
</main>

<footer th:replace="~{fragments/base :: fondo}"></footer>
</body>
</html>
