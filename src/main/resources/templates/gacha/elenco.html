<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: headerfiles('Gacha')}"></head>
<body>
<header th:replace="~{fragments/base :: intestazione}"></header>
<main class="container">
    <div th:replace="~{fragments/base :: messaggi}"></div>
    <h1>Serie gacha</h1>

    <p th:if="${credenziali != null and credenziali.admin}">
        <a class="bottone secondario" th:href="@{/admin/gacha/nuovo}">Nuova serie gacha</a>
    </p>
    <div class="griglia">
        <article class="card" th:each="g : ${gacha}">
            <a th:href="@{/gacha/{id}(id=${g.id})}">
                <img th:if="${g.immagine}" th:src="${g.immagine}" th:alt="${g.nome}"/>
                <div class="card-corpo">
                    <h3 th:text="${g.nome}">nome</h3>
                    <p class="meta" th:text="${g.azienda.nome} + ' - ' + ${g.serie.nome}">azienda - serie</p>
                    <p class="prezzo" th:text="${#numbers.formatDecimal(g.prezzo, 1, 2)} + ' EUR'">prezzo</p>
                </div>
            </a>
        </article>
    </div>
    <p th:if="${#lists.isEmpty(gacha)}">Nessuna serie gacha registrata.</p>
</main>
<footer th:replace="~{fragments/base :: fondo}"></footer>
</body>
</html>
