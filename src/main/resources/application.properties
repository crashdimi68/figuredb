spring.application.name=figuredb

# ---------------------------------------------------------------------------
# Database: PostgreSQL
#
# Prima di avviare, creare il database vuoto:  createdb figuredb
#
# Le credenziali NON sono scritte qui: vengono lette da variabili d'ambiente,
# cosi' ognuno usa le proprie e nessuna password finisce su Git.
# La sintassi ${NOME:default} significa "usa la variabile NOME, e se non
# esiste usa il valore dopo i due punti".
#
# Per impostarle una volta sola su Windows, in PowerShell:
#     setx DB_USERNAME "postgres"
#     setx DB_PASSWORD "la-tua-password"
# poi CHIUDI e RIAPRI il terminale (setx vale dalle finestre nuove).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/figuredb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# update: a ogni avvio lo schema viene allineato alle entita' senza cancellare
# le tabelle. Il DatabaseSeeder carica i CSV di src/main/resources/dati solo
# quando il database e' ancora vuoto: se vuoi ricaricare il catalogo dopo aver
# modificato un CSV, svuota il database (da pgAdmin, oppure mettendo per una
# volta ddl-auto=create-drop) e riavvia.
#
# Con "update" lo schema viene adattato alle entita' senza cancellare le
# tabelle: quello che inserisci dall'interfaccia del sito (recensioni e schede
# create da amministratore) sopravvive al riavvio.
#
# In produzione si userebbe "validate".
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Statistiche di Hibernate: servono alla schermata /admin/prestazioni per
# contare quante query SQL esegue ogni strategia di accesso ai dati.
spring.jpa.properties.hibernate.generate_statistics=true

# Batch e ordinamento delle scritture: riducono il numero di round-trip
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Messaggi di errore leggibili durante lo sviluppo
# ---------------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
