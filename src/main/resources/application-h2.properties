# ---------------------------------------------------------------------------
# Profilo di comodo per far girare l'applicazione senza PostgreSQL installato.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# Console del database su http://localhost:8080/h2-console
# ATTENZIONE: la consegna richiede PostgreSQL, questo profilo serve solo
# per lo sviluppo e per le prove rapide.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:figuredb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
