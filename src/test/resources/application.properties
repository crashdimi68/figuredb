# I test usano un database H2 in memoria, indipendente da PostgreSQL.
spring.datasource.url=jdbc:h2:mem:figuredb-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.generate_statistics=true

# Le recensioni di esempio del seeder collidono con quelle inserite dai test
figuredb.seed.recensioni-esempio=false
